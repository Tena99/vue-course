<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Vue Events</h1>
    </header>
    <section id="events">
      <h2>Events in Action</h2>
      <button v-on:click="increment(5)">Add</button>
      <button v-on:click="decrement(1)">Remove</button>

      <p v-once>Starting value: {{ counter }}</p>
      <p>Result: {{ counter }}</p>

      <div>
        <!-- <input type="text" v-on:input="console.log($event.target.value)" /> -->
        <!-- <input type="text" v-on:input="setName" /> -->
        <input
          type="text"
          v-on:input="setName($event, 'Hardcoded Lastname')"
          v-on:keyup.enter="this.confirmedName = name"
        />

        <p>Your name: {{confirmedName}}</p>
      </div>

      <!-- <form v-on:submit="submitForm"> -->
      <!-- You can use modifiers  -->
      <form v-on:submit.prevent="submitForm">
        <input type="text" />
        <button>Sign Up</button>
      </form>
    </section>
  </body>
</html>
